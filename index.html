<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <h1>Login</h1>

  <input id="email" type="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Password"><br><br>

  <button id="loginBtn">Login</button>

  <p id="message"></p>
  <p id="userInfo"></p>
<script>
  const SUPABASE_URL = "https://fjkvbkspjcvfdnlxajty.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_NZscoctqsHq6AInmQIDFdQ_gYvNed5d";

  const client = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function login() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const msg = document.getElementById("message");

    // Login
    const { data, error } = await client.auth.signInWithPassword({
      email,
      password
    });

    if (error) {
      msg.textContent = "Login failed: " + error.message;
      msg.style.color = "red";
      return;
    }

    // ⭐ STEP 3: Fetch balance
    const { data: sessionData } = await client.auth.getSession();
    const user = sessionData.session.user;

    const { data: balanceRow } = await client
      .from("user_balance")
      .select("balance")
      .eq("user_id", user.id)
      .single();

    msg.textContent = "Login successful! Balance: " + balanceRow.balance;
    msg.style.color = "green";

    // Optional redirect
    // window.location.href = "/dashboard.html";
  }

  document.getElementById("loginBtn").addEventListener("click", login);
</script>
<script src="https://219847.github.io/signup/showLoggedIn.js"></script>
</body>
</html>
